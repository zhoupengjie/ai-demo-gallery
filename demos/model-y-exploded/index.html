<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Y 爆炸拆解图</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e9ecf0;
    --ink: #12161c;
    --ink2: #2a3039;
    --muted: #5d6672;
    --faint: #98a0ab;
    --line: rgba(18, 22, 28, .08);
    --line2: rgba(18, 22, 28, .14);
    --panel: rgba(255, 255, 255, .74);
    --accent: #2f6bff;
    --accent-soft: rgba(47, 107, 255, .1);
    --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 10px 30px rgba(16, 24, 40, .08);
    --font: "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", "Helvetica Neue", Arial, sans-serif;
    --mono: "Cascadia Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  button { font: inherit; color: inherit; }
  kbd { font: 600 9px/1 var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 3px; padding: 2px 3px; margin-right: 6px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); }

  .brand { position: fixed; left: 28px; top: 24px; z-index: 3; pointer-events: none; }
  .eyebrow { display: flex; align-items: center; gap: 8px; font: 700 11px/1 var(--font); letter-spacing: .2em; color: var(--accent); }
  .eyebrow::before { content: ""; width: 16px; height: 2px; border-radius: 2px; background: var(--accent); }
  .brand h1 { margin: 10px 0 0; font: 700 54px/0.95 var(--font); letter-spacing: -.025em; }
  .brand .sub { margin: 9px 0 0; font: 500 13px/1.4 var(--font); color: var(--muted); }
  .stats { display: flex; gap: 22px; margin-top: 16px; }
  .stats b { display: block; font: 650 22px/1 var(--font); letter-spacing: -.01em; }
  .stats span { display: block; margin-top: 5px; font: 500 10px/1.2 var(--font); letter-spacing: .08em; color: var(--muted); }

  .tree { position: fixed; left: 24px; top: 212px; z-index: 3; width: 252px; max-height: calc(100vh - 212px - 104px); overflow: auto; padding: 12px 10px 10px; scrollbar-width: thin; }
  .tree h2 { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 6px 8px; font: 700 12px/1 var(--font); letter-spacing: .14em; }
  .tree h2 span { font: 500 11px/1 var(--font); letter-spacing: 0; color: var(--faint); }
  .cat { border-radius: 8px; }
  .cat + .cat { margin-top: 2px; }
  .cat-head { display: flex; align-items: center; gap: 2px; }
  .cat-row { flex: 1; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; text-align: left; font: 600 13px/1 var(--font); }
  .cat-row:hover { background: rgba(18, 22, 28, .05); }
  .cat-row i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
  .cat-row em { margin-left: auto; font: 500 11px/1 var(--mono); font-style: normal; color: var(--faint); }
  .cat-row .chev { width: 10px; height: 10px; flex: none; color: var(--faint); transition: transform .2s; }
  .cat.open .chev { transform: rotate(90deg); }
  .eye { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
  .eye:hover { background: rgba(18, 22, 28, .06); color: var(--ink); }
  .eye svg { width: 16px; height: 16px; }
  .eye .off { display: none; }
  .cat.hidden .eye .on { display: none; }
  .cat.hidden .eye .off { display: block; }
  .cat.hidden .cat-row { color: var(--faint); }
  .cat.hidden .cat-row i { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  .parts { display: none; margin: 2px 0 6px 26px; padding: 0; list-style: none; }
  .cat.open .parts { display: block; }
  .parts button { display: flex; width: 100%; align-items: baseline; gap: 6px; padding: 6px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; font: 500 12.5px/1.25 var(--font); color: var(--ink2); }
  .parts button small { font: 400 10.5px/1 var(--font); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .parts button:hover { background: rgba(18, 22, 28, .05); }
  .parts button.sel { background: var(--accent-soft); color: var(--accent); }
  .tree .src { margin: 10px 6px 2px; font: 400 10.5px/1.5 var(--font); color: var(--faint); }
  .tree-toggle { display: none; }

  .toolbar { position: fixed; right: 24px; top: 24px; z-index: 4; display: flex; align-items: center; gap: 10px; padding: 6px; }
  .views { display: flex; gap: 2px; }
  .views button, .dock button { display: inline-flex; align-items: center; height: 32px; padding: 0 11px; border: 1px solid transparent; border-radius: 8px; background: transparent; font: 600 12.5px/1 var(--font); color: var(--ink2); cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s; }
  .views button:hover, .dock button:hover { background: rgba(18, 22, 28, .05); }
  .views button.on, .dock button.on { color: var(--accent); background: var(--accent-soft); border-color: rgba(47, 107, 255, .22); }
  .dock button.on kbd { color: var(--accent); border-color: rgba(47, 107, 255, .35); }
  .views button:focus-visible, .dock button:focus-visible, .sw:focus-visible, .cat-row:focus-visible, .eye:focus-visible, .parts button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatches { display: flex; gap: 6px; padding: 0 6px 0 10px; border-left: 1px solid var(--line); }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14), inset 0 -6px 8px rgba(0, 0, 0, .14), inset 0 5px 6px rgba(255, 255, 255, .28); transition: transform .15s, box-shadow .15s; }
  .sw:hover { transform: scale(1.08); }
  .sw.on { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px var(--ink), inset 0 -6px 8px rgba(0, 0, 0, .14), inset 0 5px 6px rgba(255, 255, 255, .28); }

  .card { position: fixed; right: 24px; top: 84px; z-index: 4; width: 312px; padding: 18px 18px 16px; }
  .card[hidden] { display: none; }
  .card .kind { display: flex; align-items: center; gap: 7px; font: 700 10.5px/1 var(--font); letter-spacing: .16em; color: var(--c); }
  .card .kind i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .card h3 { margin: 10px 30px 2px 0; font: 700 20px/1.25 var(--font); letter-spacing: -.01em; }
  .card .en { font: 500 11.5px/1.3 var(--font); color: var(--faint); letter-spacing: .02em; }
  .card ul { margin: 12px 0 0; padding: 0; list-style: none; }
  .card li { position: relative; padding: 8px 0 8px 14px; border-top: 1px solid var(--line); font: 500 12.5px/1.5 var(--font); color: var(--ink2); }
  .card li::before { content: ""; position: absolute; left: 1px; top: 15px; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
  .card .note { margin: 8px 0 0; padding-top: 8px; border-top: 1px dashed var(--line2); font: 400 11px/1.55 var(--font); color: var(--muted); }
  .card .note:empty { display: none; }
  .card .acts { display: flex; gap: 8px; margin-top: 14px; }
  .card .acts button { flex: 1; height: 32px; border: 1px solid var(--line2); border-radius: 8px; background: #fff; font: 600 12.5px/1 var(--font); cursor: pointer; }
  .card .acts button:hover { border-color: var(--accent); color: var(--accent); }
  .card .acts button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card .x { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
  .card .x:hover { background: rgba(18, 22, 28, .06); color: var(--ink); }

  .dock { position: fixed; left: 50%; bottom: 22px; z-index: 4; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; }
  .seg { display: flex; align-items: center; gap: 2px; }
  .seg + .seg { margin-left: 4px; padding-left: 6px; border-left: 1px solid var(--line); }
  .seg[hidden] { display: none; }
  #playBtn { gap: 7px; min-width: 84px; justify-content: center; background: var(--ink); color: #fff; }
  #playBtn:hover { background: #2a3140; }
  #playBtn svg { width: 12px; height: 12px; }
  .dock input[type=range] { -webkit-appearance: none; appearance: none; width: 150px; height: 4px; margin: 0 10px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), rgba(18, 22, 28, .12) var(--p, 0%)); border-radius: 4px; outline: none; cursor: pointer; }
  .dock input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: 0 1px 4px rgba(16, 24, 40, .2); }
  .dock input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--accent); }
  .dock input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  #pct { min-width: 38px; font: 600 12px/1 var(--mono); color: var(--muted); text-align: right; padding-right: 6px; }
  .flowinfo { padding: 0 8px 0 6px; font: 500 11.5px/1.2 var(--font); color: var(--muted); white-space: nowrap; }
  .flowinfo b { color: var(--ink); font-weight: 650; }

  .hint { position: fixed; left: 50%; bottom: 78px; z-index: 3; transform: translateX(-50%); font: 500 11px/1.6 var(--font); color: var(--faint); pointer-events: none; white-space: nowrap; }
  .hint b { color: var(--muted); font-weight: 600; }

  #labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #labels svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #labels line { stroke: rgba(30, 38, 50, .55); stroke-width: 1; }
  #labels circle { fill: #fff; stroke: rgba(30, 38, 50, .75); stroke-width: 1.5; }
  .lbl { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 8px; background: rgba(255, 255, 255, .92); border: 1px solid var(--line2); border-radius: 13px; font: 600 12px/1 var(--font); white-space: nowrap; pointer-events: auto; cursor: pointer; will-change: transform; box-shadow: 0 2px 8px rgba(16, 24, 40, .08); }
  .lbl i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .lbl:hover, .lbl.active { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }

  .tip { position: fixed; z-index: 5; left: 0; top: 0; padding: 6px 10px; background: rgba(18, 22, 28, .9); color: #fff; border-radius: 7px; font: 600 12px/1.2 var(--font); pointer-events: none; opacity: 0; transition: opacity .12s; white-space: nowrap; }
  .tip small { display: block; margin-top: 3px; font: 500 10.5px/1 var(--font); color: rgba(255, 255, 255, .6); }
  .tip.show { opacity: 1; }

  .boot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; align-content: center; gap: 14px; background: var(--bg); transition: opacity .6s; }
  .boot.done { opacity: 0; pointer-events: none; }
  .boot p { margin: 0; font: 500 13px/1.6 var(--font); color: var(--muted); text-align: center; padding: 0 24px; }
  .boot .spin { width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid rgba(18, 22, 28, .1); border-top-color: var(--accent); animation: spin .9s linear infinite; }
  .boot.err .spin { display: none; }
  .boot.err p { color: #b42318; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 1180px) {
    .brand h1 { font-size: 44px; }
    .stats { gap: 16px; }
    .stats b { font-size: 19px; }
    .tree { top: 196px; max-height: calc(100vh - 196px - 104px); }
    .views button { padding: 0 8px; }
  }
  @media (max-width: 860px) {
    .brand { left: 16px; top: 14px; }
    .brand h1 { font-size: 32px; margin-top: 6px; }
    .brand .sub { font-size: 11px; margin-top: 5px; }
    .stats { margin-top: 10px; gap: 12px; }
    .stats b { font-size: 15px; }
    .stats span { font-size: 9px; }
    .eyebrow { font-size: 9.5px; }
    .toolbar { right: 12px; top: 12px; flex-direction: column; align-items: flex-end; padding: 5px; gap: 6px; }
    .views { display: none; }
    .swatches { border-left: 0; padding: 0; flex-direction: column; }
    .tree-toggle { display: inline-flex; position: fixed; left: 16px; top: 150px; z-index: 4; height: 30px; align-items: center; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); font: 700 11px/1 var(--font); letter-spacing: .1em; cursor: pointer; }
    .tree { display: none; left: 12px; right: 12px; top: 188px; width: auto; max-height: 48vh; }
    .tree.open { display: block; }
    .card { left: 12px; right: 12px; top: auto; bottom: 128px; width: auto; max-height: 44vh; overflow: auto; }
    .dock { left: 12px; right: 12px; bottom: 12px; transform: none; flex-wrap: wrap; justify-content: center; row-gap: 6px; }
    .dock input[type=range] { width: 110px; }
    .dock kbd, .flowinfo { display: none; }
    .seg + .seg { margin-left: 2px; padding-left: 2px; border-left: 0; }
    .dock button { padding: 0 9px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .boot .spin { animation-duration: 3s; }
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.min.js",

    }
  }
</script>

<body>
<canvas id="gl" tabindex="0" aria-label="Model Y 三维爆炸拆解模型"></canvas>
<div id="labels"><svg id="leaders"></svg></div>
<div class="tip" id="tip"></div>
<div class="boot" id="boot"><div class="spin"></div><p>正在从 CDN 加载 three.js 并生成模型…</p></div>

<header class="brand">
  <div class="eyebrow">EXPLODED VIEW · 交互拆解</div>
  <h1>Model Y</h1>
  <p class="sub">焕新版 · 长续航全轮驱动 · 概念拆解可视化</p>
  <div class="stats">
    <div><b>4797</b><span>车长 mm</span></div>
    <div><b>2890</b><span>轴距 mm</span></div>
    <div><b>0.22</b><span>风阻 Cd</span></div>

  </div>
</header>

<button class="tree-toggle" id="treeToggle">部件</button>
<aside class="panel tree" id="tree" aria-label="部件结构">
  <h2>部件结构<span id="partCount"></span></h2>
  <div id="treeBody"></div>
  <p class="src">非官方模型：外形按公开尺寸程序化近似，内部结构、电芯排布与走线均为示意。</p>
</aside>

<div class="panel toolbar">
  <div class="views" id="views">
    <button data-view="hero" class="on" title="前 45° (1)">前 45°</button>
    <button data-view="side" title="侧视 (2)">侧视</button>
    <button data-view="top" title="俯视 (3)">俯视</button>

</div>

<aside class="panel card" id="card" hidden aria-live="polite">
  <button class="x" id="cardClose" aria-label="关闭">×</button>
  <div class="kind"><i></i><span id="cardKind"></span></div>
  <h3 id="cardName"></h3>
  <div class="en" id="cardEn"></div>
  <ul id="cardSpecs"></ul>
  <p class="note" id="cardNote"></p>
  <div class="acts"><button id="cardFocus">聚焦</button><button id="cardIso">只看它</button></div>
</aside>

<nav class="panel dock" aria-label="演示控制">
  <div class="seg">
    <button id="playBtn" title="拆解 / 复原 (E)"><svg viewBox="0 0 12 12" aria-hidden="true"><path id="playIco" fill="currentColor" d="M2 1.2v9.6L10.4 6z"/></svg><span id="playTxt">拆解</span></button>
    <input id="explode" type="range" min="0" max="1000" value="0" aria-label="拆解程度">
    <output id="pct">0%</output>
  </div>
  <div class="seg">
    <button data-act="xray" title="透视车身 (X)"><kbd>X</kbd>透视</button>
    <button data-act="labels" class="on" title="部件标注 (L)"><kbd>L</kbd>标注</button>
    <button data-act="flow" title="能量流 (F)"><kbd>F</kbd>能量流</button>
  </div>

    <button data-flow="drive" class="on">驱动</button>
    <button data-flow="regen">回收</button>
    <button data-flow="charge">充电</button>
    <span class="flowinfo" id="flowInfo"></span>
  </div>
</nav>

<div class="hint"><b>拖拽</b>旋转 · <b>滚轮</b>缩放 · <b>右键</b>平移 · <b>点击部件</b>查看说明 · <b>Esc</b> 取消选择 · <b>R</b> 复位</div>

<script type="module">
const $ = (s, r = document) => r.querySelector(s);
const bootEl = $('#boot');

// ---------------------------------------------------------------------------
// three.js from CDN (import map above). Dynamic import so a blocked CDN shows a
// readable message instead of a blank page.
// ---------------------------------------------------------------------------
let THREE, OrbitControls, RoomEnvironment, RoundedBoxGeometry, mergeGeometries;
try {
  const [three, oc, re, rb, bgu] = await Promise.all([
    import('three'),
    import('three/addons/controls/OrbitControls.js'),
    import('three/addons/environments/RoomEnvironment.js'),
    import('three/addons/geometries/RoundedBoxGeometry.js'),
    import('three/addons/utils/BufferGeometryUtils.js'),
  ]);
  THREE = three; OrbitControls = oc.OrbitControls; RoomEnvironment = re.RoomEnvironment;
  RoundedBoxGeometry = rb.RoundedBoxGeometry; mergeGeometries = bgu.mergeGeometries;
} catch (err) {
  bootEl.classList.add('err');
  bootEl.querySelector('p').textContent = 'three.js 加载失败：请确认网络可以访问 cdn.jsdelivr.net 后刷新页面。';
  throw err;
}
const V3 = THREE.Vector3;
const T_BUILD = performance.now();

// ---------------------------------------------------------------------------
// math
// ---------------------------------------------------------------------------
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const damp = (a, b, k, dt) => lerp(a, b, 1 - Math.exp(-k * dt));
const linspace = (a, b, n) => { const r = new Array(n); for (let i = 0; i < n; i++) r[i] = n === 1 ? a : a + (b - a) * (i / (n - 1)); return r; };

// Monotone cubic (Fritsch–Carlson) so profile curves never overshoot.
function pchip(pts) {
  const n = pts.length, xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const h = [], d = [], m = new Array(n);
  for (let i = 0; i < n - 1; i++) { h[i] = xs[i + 1] - xs[i]; d[i] = (ys[i + 1] - ys[i]) / h[i]; }
  m[0] = d[0]; m[n - 1] = d[n - 2];
  for (let i = 1; i < n - 1; i++) {
    if (d[i - 1] * d[i] <= 0) m[i] = 0;
    else { const w1 = 2 * h[i] + h[i - 1], w2 = h[i] + 2 * h[i - 1]; m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]); }
  }
  return (x) => {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[n - 1]) return ys[n - 1];
    let lo = 0, hi = n - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] > x) hi = mid; else lo = mid; }
    const t = (x - xs[lo]) / h[lo], t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[lo] + (t3 - 2 * t2 + t) * h[lo] * m[lo] + (-2 * t3 + 3 * t2) * ys[lo + 1] + (t3 - t2) * h[lo] * m[lo + 1];
  };
}

// ---------------------------------------------------------------------------
// Dimensions (m). Public figures: 4797 × 1920 × 1624 mm, wheelbase 2890 mm,
// track 1636 mm, 255/45 R19 tyres. +x = front, +y = up, +z = right side.
// ---------------------------------------------------------------------------
const CAR_L = 4.797, WB = 2.890, TRACK = 1.636;
const XN = CAR_L / 2, XT = -CAR_L / 2;
const XFA = XN - 0.925, XRA = XFA - WB;
const TIRE_R = 0.356, WY = 0.352, HT = TRACK / 2;
const ARCH_R = 0.405;
const RF = 0.62, NF = 2.4, RR = 0.44, NR = 2.8;   // plan-view corner rounding, front / rear
const T1 = 0.5, T2 = 0.54;                        // cross-section: dome | ledge | lower side

function reg(obj, part) {
  obj.traverse((o) => {
    if (!o.isMesh || o.userData.part) return;   // sub-parts registered first keep their own key
    o.userData.part = part;
    o.userData.base = o.material;
    const isLight = o.material === M.lightW || o.material === M.lightR || o.material === M.ambient;
    o.castShadow = !isLight; o.receiveShadow = true;
    if (!meshesByPart.has(part)) meshesByPart.set(part, []);
    meshesByPart.get(part).push(o);
    pickables.push(o);
  });
  return obj;
}

}

for (const xc of ARCHES) for (const s of sideSigns) {
  const pts = [], n = 48, sillY = 0.26;
  for (let i = 0; i <= n; i++) {
    const u = i / n; let x, y;
    const flank = (WY - sillY) / (Math.PI * ARCH_R + 2 * (WY - sillY));
    if (u < flank) { x = xc + ARCH_R; y = lerp(sillY, WY, u / flank); }
    else if (u > 1 - flank) { x = xc - ARCH_R; y = lerp(WY, sillY, (u - 1 + flank) / flank); }
    else { const a = ((u - flank) / (1 - 2 * flank)) * Math.PI; x = xc + Math.cos(a) * ARCH_R; y = WY + Math.sin(a) * ARCH_R; }
    pts.push([x, y]);
  }
  const pos = [], idx = [];
  pts.forEach(([x, y], i) => {
    const ys = P.sh(x), ysl = P.sill(x), q = clamp01((ys - y) / (ys - ysl));
    const zo = P.ws(x) * planF(x) * (1 - (1 - P.tuck(x)) * Math.pow(q, 2.6)) - 0.008;
    const rr = 1.015;
    const px = xc + (x - xc) * rr, py = WY + (y - WY) * rr;
    pos.push(px, py, s * zo, px, py, s * 0.6);
    if (i < pts.length - 1) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx); geo.computeVertexNormals();
  cage.add(new THREE.Mesh(geo, M.plastic));
}

function drawScreen(g, w, h, mode) {
  g.fillStyle = '#10141a'; g.fillRect(0, 0, w, h);
  g.save(); g.translate(w * 0.38, 0);
  g.fillStyle = '#1a2029'; g.fillRect(0, 0, w * 0.62, h);
  g.strokeStyle = 'rgba(160,175,195,.18)'; g.lineWidth = 2;
  for (let i = 0; i < 9; i++) { g.beginPath(); g.moveTo(i * 42 - 60, 0); g.lineTo(i * 42 + 40, h); g.stroke(); }
  for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(0, i * 56 + 10); g.lineTo(w, i * 56 - 30); g.stroke(); }
  g.strokeStyle = 'rgba(80,140,200,.35)'; g.lineWidth = 14; g.beginPath(); g.moveTo(-10, h * 0.8); g.bezierCurveTo(90, h * 0.6, 120, h * 0.95, w * 0.62, h * 0.7); g.stroke();
  g.strokeStyle = '#3d8bff'; g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(60, h - 20); g.lineTo(80, h * 0.62); g.lineTo(190, h * 0.48); g.lineTo(230, 40); g.stroke();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(230, 40, 7, 0, Math.PI * 2); g.fill();
  g.restore();
  g.fillStyle = '#e8edf3'; g.font = '700 64px "Segoe UI", Arial'; g.textAlign = 'left';
  const speed = mode === 'drive' ? '96' : mode === 'regen' ? '64' : '0';
  g.fillText(speed, 28, 92);
  g.font = '500 18px "Segoe UI", Arial'; g.fillStyle = '#8b96a5'; g.fillText('km/h', 30, 118);
  g.font = '600 18px "Segoe UI", Arial'; g.fillStyle = '#c9d1db';
  g.fillText(mode === 'charge' ? '充电中 · 82%' : '82%  ·  412 km', 28, 160);
  g.fillStyle = mode === 'charge' ? '#22c55e' : '#3d8bff'; g.fillRect(28, 172, 140 * 0.82, 8);
  g.strokeStyle = 'rgba(255,255,255,.2)'; g.lineWidth = 1; g.strokeRect(28, 172, 140, 8);
  // top-view car glyph
  g.fillStyle = '#d5dbe3'; g.beginPath(); g.roundRect(70, 200, 58, 96, 24); g.fill();
  g.fillStyle = '#10141a'; g.beginPath(); g.roundRect(78, 226, 42, 26, 8); g.fill();
  g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, h - 34, w, 34);
  g.fillStyle = 'rgba(255,255,255,.45)'; for (let i = 0; i < 7; i++) g.fillRect(40 + i * 80, h - 22, 18, 10);
}

const uTime = { value: 0 };
function flowMat(color, len) {
  return new THREE.ShaderMaterial({
    uniforms: { uTime, uColor: { value: new THREE.Color(color) }, uDir: { value: 1 }, uOn: { value: 0 }, uLen: { value: len }, uSpeed: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: `uniform float uTime, uDir, uOn, uLen, uSpeed; uniform vec3 uColor; varying vec2 vUv;
      void main(){
        float s = fract(vUv.x * uLen * 3.0 - uTime * 1.4 * uSpeed * uDir);
        float pulse = smoothstep(0.0, 0.12, s) * (1.0 - smoothstep(0.12, 0.55, s));
        float a = (0.18 + 0.82 * pulse) * uOn;
        if (a < 0.01) discard;
        gl_FragColor = vec4(mix(uColor, vec3(1.0), pulse * 0.35), a);
      }`,
    transparent: true, depthWrite: false, depthTest: false, toneMapped: false,
  });
}

}

const variants = new Map();
function variant(base, kind) {
  if (Array.isArray(base)) return base.map((b) => variant(b, kind));
  if (kind === 'ghost') return ghostMat;
  if (kind === 'xray') return xrayMat;
  const k = base.uuid + kind;
  if (!variants.has(k)) {
    const m = base.clone();
    if (m.emissive) { m.emissive = ACCENT.clone(); m.emissiveIntensity = kind === 'sel' ? 0.42 : 0.22; }
    else if (m.color) m.color.lerp(ACCENT, kind === 'sel' ? 0.5 : 0.3);
    variants.set(k, m);
  }
  return variants.get(k);
}

  }
  for (const side of [-1, 1]) {
    const arr = items.filter((i) => i.side === side).sort((a, b) => a.ly - b.ly);
    for (let i = 1; i < arr.length; i++) if (arr[i].ly - arr[i - 1].ly < 30) arr[i].ly = arr[i - 1].ly + 30;
  }
  for (const it of items) {
    const { L, sx, sy, side } = it;
    L.el.style.display = ''; L.line.style.display = ''; L.dot.style.display = '';
    if (!L.w) L.w = L.el.offsetWidth;
    const ly = clamp(it.ly, 70, H - 120);
    const ex = clamp(side < 0 ? sx - 64 - L.w : sx + 64, 8, W - L.w - 8);
    const lx = side < 0 ? ex + L.w : ex;
    L.el.style.transform = `translate(${ex.toFixed(1)}px, ${(ly - 13).toFixed(1)}px)`;
    L.line.setAttribute('x1', lx); L.line.setAttribute('y1', ly); L.line.setAttribute('x2', sx); L.line.setAttribute('y2', sy);
    L.dot.setAttribute('cx', sx); L.dot.setAttribute('cy', sy);
  }
}

// dock
const slider = $('#explode'), pctEl = $('#pct');
let sliding = false;
slider.addEventListener('input', () => { sliding = true; state.p = state.target = slider.value / 1000; wake(); });
slider.addEventListener('change', () => { sliding = false; });
$('#playBtn').addEventListener('click', () => toggleExplode());
function toggleExplode() { state.target = state.target > 0.5 ? 0 : 1; wake(); }
const acts = {
  xray: () => { state.xray = !state.xray; applyLook(); },
  labels: () => { state.labels = !state.labels; },
  flow: () => { state.flow = !state.flow; if (state.flow) { if (!state.xray) acts.xray(); state.target = 0; } $('#flowSeg').hidden = !state.flow; },
};
function syncButtons() {
  document.querySelectorAll('[data-act]').forEach((b) => b.classList.toggle('on', !!state[b.dataset.act]));
  document.querySelectorAll('[data-flow]').forEach((b) => b.classList.toggle('on', b.dataset.flow === state.flowMode));
}
document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => { acts[b.dataset.act](); syncButtons(); wake(); }));
const FLOW_INFO = { drive: '<b>驱动</b> · 电池 → 双电机', regen: '<b>回收</b> · 电机 → 电池', charge: '<b>充电</b> · 充电口 → 电池' };
function setFlowMode(m) { state.flowMode = m; $('#flowInfo').innerHTML = FLOW_INFO[m]; redrawScreen(m); syncButtons(); wake(); }
document.querySelectorAll('[data-flow]').forEach((b) => b.addEventListener('click', () => setFlowMode(b.dataset.flow)));
$('#flowInfo').innerHTML = FLOW_INFO.drive;

// ---------------------------------------------------------------------------
// Camera: views, explode-aware framing, flights
// ---------------------------------------------------------------------------
// dir = assembled view direction, dirX = direction once fully exploded (higher, to see into the stack)
const VIEWS = {
  hero: { dir: new V3(0.74, 0.3, -0.6), dirX: new V3(0.72, 0.5, -0.62), dist: 8.6, target: new V3(0.1, 0.7, 0) },
  side: { dir: new V3(0.0, 0.1, -1), dirX: new V3(0.0, 0.2, -1), dist: 8.8, target: new V3(0, 0.75, 0) },
  top: { dir: new V3(0.02, 1, -0.06), dirX: new V3(0.02, 1, -0.06), dist: 10.5, target: new V3(0, 0.4, 0) },
  rear: { dir: new V3(-0.74, 0.3, -0.6), dirX: new V3(-0.72, 0.5, -0.62), dist: 8.6, target: new V3(-0.1, 0.7, 0) },
};
const FRAME_DY = 1.35, FRAME_K = 0.55;
let curView = 'hero';
const frameE = () => {
  const kA = ease(clamp01(state.p / 0.4)), kB = ease(clamp01((state.p - 0.2) / 0.45)), kC = ease(clamp01((state.p - 0.5) / 0.5));
  return 0.2 * kA + 0.6 * kB + 0.2 * kC;
};
const aspectFit = () => clamp(1.25 / camera.aspect, 1, 2.3);
let fly = null;
function viewEnd(name) {
  const v = VIEWS[name], e = frameE();
  const q = v.target.clone(); q.y += FRAME_DY * e * (name === 'top' ? 0.3 : 1);
  const dir = v.dir.clone().normalize().lerp(v.dirX.clone().normalize(), e).normalize();
  const p = q.clone().addScaledVector(dir, v.dist * (1 + FRAME_K * e) * aspectFit());
  return [p, q];
}
function flyTo(name, dur = 1.4) {
  curView = name;
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === name));
  fly = { t0: time, dur, p0: camera.position.clone(), q0: controls.target.clone(), end: () => viewEnd(name) };
  wake();
}
function focusPart(part) {
  _box.makeEmpty();
  for (const m of meshesByPart.get(part)) if (m.visible) _box.expandByObject(m);
  if (_box.isEmpty()) return;
  const c = _box.getCenter(new V3()), size = _box.getSize(new V3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  const dist = clamp(size * 1.6, 2.4, 14) * aspectFit();
  fly = { t0: time, dur: 1.1, p0: camera.position.clone(), q0: controls.target.clone(), end: () => [c.clone().addScaledVector(dir, dist), c] };
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.remove('on'));
}
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => flyTo(b.dataset.view)));
let lastE = 0;
function applyFraming() {
  const e = frameE();
  if (!fly && Math.abs(e - lastE) > 1e-6) {
    const off = camera.position.clone().sub(controls.target).multiplyScalar((1 + FRAME_K * e) / (1 + FRAME_K * lastE));
    controls.target.y += FRAME_DY * (e - lastE);
    camera.position.copy(controls.target).add(off);
  }
  lastE = e;
}

// ---------------------------------------------------------------------------
// Picking
// ---------------------------------------------------------------------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), tip = $('#tip');
let pointer = null, down = null, dragging = false, pickDirty = false;
function pick() {
  ray.setFromCamera(ndc, camera);
  const list = pickables.filter((m) => { const mm = Array.isArray(m.material) ? m.material[0] : m.material; return m.visible && mm !== ghostMat && mm !== xrayMat; });
  const hit = ray.intersectObjects(list, false)[0];
  return hit ? hit.object.userData.part : null;
}
canvas.addEventListener('pointermove', (e) => {
  pointer = { x: e.clientX, y: e.clientY };
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  pickDirty = true;
});
canvas.addEventListener('pointerleave', () => { pointer = null; if (state.hover) { state.hover = null; applyLook(); } tip.classList.remove('show'); });
canvas.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; wake(); });
canvas.addEventListener('pointerup', (e) => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < 5 && performance.now() - down.t < 500 && e.button === 0) {
    ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    const part = pick();
    select(part === state.sel ? null : part);
  }
  down = null;
});
controls.addEventListener('start', () => { dragging = true; fly = null; wake(); document.querySelectorAll('[data-view]').forEach((b) => b.classList.remove('on')); });
controls.addEventListener('end', () => { dragging = false; });
let pickClock = 0;
function updateHover(dt) {
  pickClock += dt;
  if (!pointer || dragging || !pickDirty || pickClock < 0.04) return;
  pickClock = 0; pickDirty = false;
  const part = pick();
  if (part !== state.hover) { state.hover = part; applyLook(); canvas.style.cursor = part ? 'pointer' : ''; }
  if (part) {
    tip.innerHTML = `${PARTS[part].name}<small>${CAT[PARTS[part].cat].name}</small>`;
    tip.style.transform = `translate(${pointer.x + 14}px, ${pointer.y + 16}px)`;
    tip.classList.add('show');
  } else tip.classList.remove('show');
}

// keyboard
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'e' || k === ' ') { e.preventDefault(); toggleExplode(); }
  else if (acts[{ x: 'xray', l: 'labels', f: 'flow' }[k]]) { acts[{ x: 'xray', l: 'labels', f: 'flow' }[k]](); syncButtons(); wake(); }
  else if ('1234'.includes(k) && k) flyTo(['hero', 'side', 'top', 'rear'][+k - 1]);
  else if (k === 'r') { select(null); flyTo('hero'); }
  else if (k === 'escape') { if (state.iso) { state.iso = null; $('#cardIso').classList.remove('on'); applyLook(); } else select(null); }
});
function wake() { lastInput = time; controls.autoRotate = false; }

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  // keep the car centred in the space right of the parts panel
  camera.filmOffset = w > 860 ? -(150 / w) * camera.getFilmWidth() : 0;
  camera.updateProjectionMatrix();
  labels.forEach((L) => { L.w = 0; });
}
addEventListener('resize', resize);
resize();

// ---------------------------------------------------------------------------
// Deep links: #p=1&view=side&color=blue&xray&flow=charge&sel=pack&nolabels&noauto&t=6
// ---------------------------------------------------------------------------
const hp = new URLSearchParams(location.hash.slice(1));
setPaint(hp.get('color') || 'red');
if (hp.has('xray')) state.xray = true;
if (hp.has('nolabels')) state.labels = false;
if (hp.has('flow')) { state.flow = true; state.xray = true; $('#flowSeg').hidden = false; setFlowMode(['drive', 'regen', 'charge'].includes(hp.get('flow')) ? hp.get('flow') : 'drive'); }
const startView = VIEWS[hp.get('view')] ? hp.get('view') : 'hero';
{
  const [p, q] = viewEnd(startView);
  controls.target.copy(q);
  camera.position.copy(q).addScaledVector(p.clone().sub(q), 1.45).add(new V3(0, 0.6, 0));
}
const timeline = [[0.2, () => flyTo(startView, 1.8)]];
if (hp.has('p')) { const v = clamp01(parseFloat(hp.get('p')) || 0); timeline.push([0.4, () => { state.target = v; }]); }
else if (hp.has('explode') || !(hp.has('noauto') || state.flow)) timeline.push([1.6, () => { state.target = 1; }]);
if (hp.has('sel') && PARTS[hp.get('sel')]) timeline.push([0.5, () => select(hp.get('sel'))]);
applyLook(); syncButtons();

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
const FLOW_DIR = { drive: { hv: 1, chg: 0, cool: 1, wheel: 9 }, regen: { hv: -1, chg: 0, cool: 1, wheel: 6 }, charge: { hv: 0, chg: 1, cool: 0.6, wheel: 0 } };
let wheelSpeed = 0, playState = null;
const playTxt = $('#playTxt'), playIco = $('#playIco');
function tick(dt) {
  time += dt; uTime.value = time;
  while (timeline.length && timeline[0][0] <= time) timeline.shift()[1]();

  if (!sliding) {
    const d = state.target - state.p, step = dt / 3.0;
    state.p = Math.abs(d) <= step ? state.target : state.p + Math.sign(d) * step;
  }
  const p = state.p;
  upper.position.y = 2.0 * ease(clamp01((p - 0.2) / 0.45));
  cabin.position.y = 0.95 * ease(clamp01((p - 0.26) / 0.45));
  for (const pc of pieces) {
    const [s0, len] = STAGES[pc.stage];
    pc.obj.position.copy(pc.base).addScaledVector(pc.off, ease(clamp01((p - s0 - pc.delay) / len)));
  }
  blob.material.opacity = 1 - 0.75 * ease(clamp01(p / 0.5));

  // energy flow
  const fm = FLOW_DIR[state.flowMode];
  const flowOn = state.flow ? 1 - smooth(0.02, 0.15, p) : 0;
  for (const f of flows) {
    const u = f.m.material.uniforms;
    const dir = f.kind === 'hv' ? fm.hv : f.kind === 'chg' ? fm.chg : fm.cool;
    u.uOn.value = damp(u.uOn.value, dir !== 0 ? flowOn : 0, 6, dt);
    if (dir !== 0) u.uDir.value = Math.sign(dir);
    u.uSpeed.value = Math.abs(dir) || 1;
    f.m.visible = u.uOn.value > 0.01;
  }
  M.cellTop.emissive.setRGB(0.05, 0.5, 0.18).multiplyScalar(state.flow && state.flowMode === 'charge' ? 0.35 + 0.35 * Math.sin(time * 4) : 0);
  wheelSpeed = damp(wheelSpeed, state.flow ? fm.wheel : 0, 2, dt);
  for (const s of spinners) s.rotation.z -= wheelSpeed * dt;

  // camera
  if (fly) {
    const k = ease(clamp01((time - fly.t0) / fly.dur)), [p1, q1] = fly.end();
    camera.position.lerpVectors(fly.p0, p1, k); controls.target.lerpVectors(fly.q0, q1, k);
    if (k >= 1) fly = null;
  }
  applyFraming();
  controls.autoRotate = !fly && !dragging && time - lastInput > 14 && !state.sel;

  // ui
  slider.value = Math.round(p * 1000);
  slider.style.setProperty('--p', `${(p * 100).toFixed(1)}%`);
  pctEl.textContent = `${Math.round(p * 100)}%`;
  const exploding = state.target > 0.5;
  if (exploding !== playState) {
    playState = exploding;
    playTxt.textContent = exploding ? '复原' : '拆解';
    playIco.setAttribute('d', exploding ? 'M1.5 2.2h9v1.6h-9zM1.5 5.2h9v1.6h-9zM1.5 8.2h9v1.6h-9z' : 'M2 1.2v9.6L10.4 6z');
  }
}

const ff = clamp(parseFloat(hp.get('t')) || 0, 0, 30);
for (let i = 0; i < ff * 60; i++) tick(1 / 60);
try { await renderer.compileAsync(scene, camera); } catch { /* falls back to compiling on first render */ }
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  tick(dt);
  controls.update(dt);
  updateHover(dt);
  renderer.render(scene, camera);
  updateLabels(dt);
  requestAnimationFrame(frame);
}
renderer.render(scene, camera);
bootEl.classList.add('done');
requestAnimationFrame(frame);
console.info(`[model-y] scene built in ${(performance.now() - T_BUILD).toFixed(0)} ms`);
window.__modelY = { state, select, flyTo, setPaint, camera, scene, renderer, controls };
</script>
</body>
</html>
