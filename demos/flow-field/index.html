<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Field</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080b; }
  canvas { display: block; position: fixed; inset: 0; }
  .hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 2;
    display: grid; gap: 10px; width: 210px; padding: 12px 14px;
    background: rgba(12, 14, 18, .72); border: 1px solid rgba(255, 255, 255, .09);
    border-radius: 12px; backdrop-filter: blur(12px);
    font: 500 11px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .08em; color: #c9d1dc; text-transform: uppercase;
  }
  .row { display: grid; grid-template-columns: 52px 1fr; align-items: center; gap: 8px; }
  input[type=range] { -webkit-appearance: none; appearance: none; height: 2px; background: #2a2f38; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #8ab4ff; border: 0; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 10px; height: 10px; border-radius: 50%; background: #8ab4ff; border: 0; }
  button {
    font: inherit; letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
    padding: 7px 10px; color: #dbe4f0; background: #1a1f27;
    border: 1px solid #2c333d; border-radius: 7px;
  }
  button:hover { background: #232a34; border-color: #3b444f; }
  .hint { position: fixed; right: 16px; bottom: 16px; font: 500 10px/1.4 ui-monospace, monospace; color: #4d5560; text-align: right; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="row"><span>Part</span><input id="density" type="range" min="600" max="6000" step="200" value="2600"></div>
  <div class="row"><span>Speed</span><input id="speed" type="range" min="30" max="300" step="10" value="100"></div>
  <button id="reseed">Reseed</button>
</div>
<div class="hint">move to disturb<br>click to reseed</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha: false });
const TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1;
let noise = () => 0;
let particles = [];
let density = 2600;
let speed = 1;
let time = 0;

function makeNoise(seed) {
  let s = seed >>> 0;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    const t = p[i]; p[i] = p[j]; p[j] = t;
  }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  const grad = (h, x, y) => ((h & 1) ? x : -x) + ((h & 2) ? y : -y);
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const X = xi & 255, Y = yi & 255;
    const xf = x - xi, yf = y - yi;
    const u = fade(xf), v = fade(yf);
    const aa = perm[perm[X] + Y], ab = perm[perm[X] + Y + 1];
    const ba = perm[perm[X + 1] + Y], bb = perm[perm[X + 1] + Y + 1];
    const l1 = grad(aa, xf, yf) * (1 - u) + grad(ba, xf - 1, yf) * u;
    const l2 = grad(ab, xf, yf - 1) * (1 - u) + grad(bb, xf - 1, yf - 1) * u;
    return l1 * (1 - v) + l2 * v;
  };
}

const pointer = { x: -1e5, y: -1e5, active: false };

function spawn() {
  return {
    x: Math.random() * W,
    y: Math.random() * H,
    px: 0, py: 0,
    life: 40 + Math.random() * 220,
  };
}

function seedParticles() {
  particles = Array.from({ length: density }, () => {
    const p = spawn();
    p.px = p.x; p.py = p.y;
    return p;
  });
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#07080b';
  ctx.fillRect(0, 0, W, H);
  seedParticles();
}

const BUCKETS = 9;
const COLORS = Array.from({ length: BUCKETS }, (_, i) => `hsla(${190 + i * 16}, 85%, ${58 + (i % 3) * 6}%, 0.5)`);

function frame() {
  ctx.fillStyle = 'rgba(7, 8, 11, 0.055)';
  ctx.fillRect(0, 0, W, H);
  const fresh = Array.from({ length: BUCKETS }, () => new Path2D());

  const scale = 0.0016;
  const t = time * 0.00012;

  for (const p of particles) {
    const n = noise(p.x * scale + t, p.y * scale - t);
    const angle = n * TAU * 1.5 + time * 0.0004;
    const stepLen = 1.1 + speed * 0.9;
    let vx = Math.cos(angle) * stepLen;
    let vy = Math.sin(angle) * stepLen;

    if (pointer.active) {
      const dx = p.x - pointer.x, dy = p.y - pointer.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 26000 && d2 > 1) {
        const d = Math.sqrt(d2);
        const f = (1 - d2 / 26000) * 3.2;
        vx += (dx / d) * f * stepLen;
        vy += (dy / d) * f * stepLen;
      }
    }

    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy;
    p.life -= 1;

    const bucket = Math.min(BUCKETS - 1, Math.max(0, Math.floor(((n + 1) / 2) * BUCKETS)));
    fresh[bucket].moveTo(p.px, p.py);
    fresh[bucket].lineTo(p.x, p.y);

    if (p.life <= 0 || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
      const np = spawn();
      p.x = np.x; p.y = np.y; p.px = np.x; p.py = np.y; p.life = np.life;
    }
  }

  ctx.lineWidth = 1;
  for (let i = 0; i < BUCKETS; i++) {
    ctx.strokeStyle = COLORS[i];
    ctx.stroke(fresh[i]);
  }

  time += 16;
  requestAnimationFrame(frame);
}

document.getElementById('density').addEventListener('input', (e) => {
  const next = Number(e.target.value);
  if (next > particles.length) {
    for (let i = particles.length; i < next; i++) particles.push(spawn());
  } else {
    particles.length = next;
  }
  density = next;
});

document.getElementById('speed').addEventListener('input', (e) => {
  speed = Number(e.target.value) / 100;
});

document.getElementById('reseed').addEventListener('click', reseed);

function reseed() {
  noise = makeNoise((Math.random() * 1e9) | 0);
  ctx.fillStyle = '#07080b';
  ctx.fillRect(0, 0, W, H);
  seedParticles();
}

window.addEventListener('pointermove', (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY; pointer.active = true;
});
window.addEventListener('pointerleave', () => { pointer.active = false; });
window.addEventListener('pointerdown', (e) => {
  pointer.x = e.clientX; pointer.y = e.clientY;
  reseed();
});
window.addEventListener('resize', resize);

noise = makeNoise(20261103);
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
